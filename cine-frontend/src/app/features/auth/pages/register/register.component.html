<div class="min-h-[70vh] flex items-center justify-center py-12 animate-fade-in">
  <div class="w-full max-w-md space-y-8">

    <!-- Logo + título -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mx-auto"
           style="background: var(--accent); box-shadow: 0 4px 24px var(--accent-glow);">🎬</div>
      <h1 class="text-2xl font-black" style="color: var(--text-primary);">Crear Cuenta</h1>
      <p class="text-sm" style="color: var(--text-muted);">Únete y empieza a reservar entradas.</p>
    </div>

    <!-- Card del formulario -->
    <div class="card-cinema p-8 space-y-5">

      <div class="space-y-1.5">
        <label class="text-xs font-semibold" style="color: var(--text-secondary);">Nombre completo</label>
        <input type="text" [(ngModel)]="name" class="input-cinema" placeholder="Tu nombre" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold" style="color: var(--text-secondary);">Correo electrónico</label>
        <input type="email" [(ngModel)]="email" class="input-cinema" placeholder="tu@email.com" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold" style="color: var(--text-secondary);">Contraseña</label>
        <input type="password" [(ngModel)]="password" class="input-cinema" placeholder="Mínimo 8 caracteres" />
      </div>

      <div class="space-y-1.5">
        <label class="text-xs font-semibold" style="color: var(--text-secondary);">Confirmar contraseña</label>
        <input type="password" [(ngModel)]="confirmPassword" class="input-cinema" placeholder="Repite tu contraseña" />
      </div>

      <!-- Términos -->
      <div class="flex items-start gap-3 pt-1">
        <input type="checkbox" [(ngModel)]="acceptTerms" id="terms" class="mt-0.5 w-4 h-4 rounded cursor-pointer"
               style="accent-color: var(--accent);" />
        <label for="terms" class="text-xs cursor-pointer" style="color: var(--text-muted);">
          Acepto los <span style="color: var(--accent-soft);" class="cursor-pointer">Términos de Servicio</span>
          y la <span style="color: var(--accent-soft);" class="cursor-pointer">Política de privacidad</span>
        </label>
      </div>

      <button (click)="register()" class="btn-primary w-full py-3 rounded-xl text-sm mt-2">
        Crear mi cuenta
      </button>

      <!-- Divisor -->
      <div class="relative flex items-center gap-3">
        <div class="flex-1 border-t" style="border-color: var(--border);"></div>
        <span class="text-xs" style="color: var(--text-muted);">o regístrate con</span>
        <div class="flex-1 border-t" style="border-color: var(--border);"></div>
      </div>

      <!-- OAuth Google -->
      <button class="w-full flex items-center justify-center gap-3 py-3 rounded-xl text-sm font-semibold btn-ghost">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </button>

      <p class="text-center text-xs" style="color: var(--text-muted);">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="font-semibold" style="color: var(--accent-soft);">Iniciar sesión</a>
      </p>
    </div>

  </div>
</div>
